<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; background: transparent; overflow: hidden; }
canvas { display: block; width: 132px; height: 132px; }
</style>
</head>
<body>
<canvas id="cursor"></canvas>
<script>
(() => {
  const SIZE = 132;
  const GLYPH = 26;
  const SCALE = GLYPH / 24;
  const FADE_IN_S = 0.12;
  const FADE_OUT_S = 0.18;
  const SWEEP_S = 3.8;
  const RIPPLE_S = 0.5;
  const glyph = new Path2D("M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z");
  const edge = new Path2D("M5.1 5.4 10.9 19.4");
  const canvas = document.getElementById("cursor");
  const ctx = canvas.getContext("2d");
  const anchor = { x: SIZE * 0.34, y: SIZE * 0.3 };
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  let dpr = 0;
  let fade = 0;
  let visible = false;
  let paused = false;
  let sweep = 0;
  let ripples = [];
  let last = 0;
  let frame = 0;

  function parseHex(value, fallback) {
    const text = typeof value === "string" ? value.trim().replace(/^#/, "") : "";
    if (!/^[0-9a-f]{6}$/i.test(text)) return fallback;
    const n = parseInt(text, 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function mix(a, p, b) {
    return [0, 1, 2].map((i) => a[i] * p + b[i] * (1 - p));
  }
  function rgba(c, alpha) {
    return `rgba(${Math.round(c[0] * 255)}, ${Math.round(c[1] * 255)}, ${Math.round(c[2] * 255)}, ${alpha})`;
  }
  function makeTheme(accentHex, dark) {
    const fallback = dark ? [0, 229 / 255, 1] : [0, 107 / 255, 214 / 255];
    const accent = parseHex(accentHex, fallback);
    const black = [0, 0, 0];
    const white = [1, 1, 1];
    return {
      accent,
      body: [mix(accent, 0.46, black), mix(accent, 0.24, black), mix(accent, 0.1, black), mix(accent, 0.04, black)],
      sheen: mix(accent, 0.24, white),
      edge: mix(accent, 0.16, white),
      rimHi: mix(accent, 0.46, white),
      rimLo: mix(accent, 0.64, black),
      shade: mix(accent, 0.06, black),
    };
  }
  let theme = makeTheme("#00e5ff", true);

  function linear(x0, y0, x1, y1, stops) {
    const gradient = ctx.createLinearGradient(x0, y0, x1, y1);
    for (const [offset, color] of stops) gradient.addColorStop(offset, color);
    return gradient;
  }
  function smoothstep(t) {
    const x = Math.min(1, Math.max(0, t));
    return x * x * (3 - 2 * x);
  }
  function easeOut(t) {
    const x = Math.min(1, Math.max(0, t));
    return 1 - (1 - x) * (1 - x);
  }
  function sweepState(phase) {
    const cycle = phase - Math.floor(phase);
    const travelEnd = 0.46;
    const fadeIn = 0.14;
    if (cycle >= travelEnd) return { opacity: 0, offset: 16 };
    const offset = -16 + 32 * smoothstep(cycle / travelEnd);
    const opacity = cycle < fadeIn ? 0.9 * (cycle / fadeIn) : 0.9 * (1 - (cycle - fadeIn) / (travelEnd - fadeIn));
    return { opacity: Math.max(0, opacity), offset };
  }

  function resize() {
    const next = window.devicePixelRatio || 1;
    if (next === dpr) return;
    dpr = next;
    canvas.width = Math.round(SIZE * dpr);
    canvas.height = Math.round(SIZE * dpr);
  }

  function drawRipples(now) {
    for (const start of ripples) {
      const t = Math.min(1, Math.max(0, (now - start) / 1000 / RIPPLE_S));
      const radius = GLYPH * 0.34 * (0.45 + 2.45 * easeOut(t));
      ctx.beginPath();
      ctx.arc(anchor.x, anchor.y, radius, 0, Math.PI * 2);
      ctx.lineWidth = 2 * (1 - t) + 0.6;
      ctx.strokeStyle = rgba(theme.accent, 0.8 * (1 - t));
      ctx.stroke();
    }
  }

  function drawPointer() {
    ctx.save();
    ctx.translate(anchor.x, anchor.y);
    ctx.scale(SCALE, SCALE);
    ctx.translate(-4.4, -4.9);

    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 4.6 * dpr;
    ctx.shadowOffsetY = 1.8 * dpr;
    ctx.fillStyle = rgba(theme.accent, 0.55);
    ctx.fill(glyph);
    ctx.restore();

    ctx.save();
    ctx.shadowColor = rgba(theme.accent, 0.38);
    ctx.shadowBlur = 10 * dpr;
    ctx.fillStyle = rgba(theme.accent, 0.38);
    ctx.fill(glyph);
    ctx.restore();

    ctx.fillStyle = linear(4, 4, 20, 21, [[0, rgba(theme.body[0], 1)], [0.34, rgba(theme.body[1], 1)], [0.68, rgba(theme.body[2], 1)], [1, rgba(theme.body[3], 1)]]);
    ctx.fill(glyph);

    ctx.save();
    ctx.clip(glyph);
    ctx.translate(7.4, 9.6);
    ctx.rotate((28 * Math.PI) / 180);
    ctx.beginPath();
    ctx.ellipse(0, 0, 5.4, 8.6, 0, 0, Math.PI * 2);
    ctx.clip();
    const cos = Math.cos((28 * Math.PI) / 180);
    ctx.fillStyle = linear(-5.4 * cos, -8.6, 5.4 * cos, 8.6, [[0, rgba(theme.sheen, 0.92)], [0.42, rgba(theme.rimHi, 0.42)], [1, rgba(theme.accent, 0)]]);
    ctx.fillRect(-12, -12, 24, 24);
    ctx.restore();

    ctx.fillStyle = linear(20, 21, 10, 10, [[0, rgba(theme.shade, 0.72)], [0.6, rgba(theme.shade, 0.18)], [1, rgba(theme.shade, 0)]]);
    ctx.fill(glyph);

    const { opacity, offset } = sweepState(sweep);
    if (opacity > 0.001) {
      const center = 12 + offset;
      ctx.fillStyle = linear(center - 32, 0, center + 32, 0, [[0, rgba(theme.rimHi, 0)], [0.5, rgba(theme.rimHi, 0.72 * opacity)], [1, rgba(theme.rimHi, 0)]]);
      ctx.fill(glyph);
    }

    ctx.save();
    ctx.clip(glyph);
    ctx.lineWidth = 1.05;
    ctx.lineCap = "round";
    ctx.strokeStyle = linear(5.1, 5.4, 10.9, 19.4, [[0, rgba(theme.edge, 0.85)], [0.45, rgba(theme.rimHi, 0.35)], [1, rgba(theme.accent, 0)]]);
    ctx.stroke(edge);
    ctx.restore();

    ctx.lineWidth = 0.9;
    ctx.lineJoin = "round";
    ctx.strokeStyle = linear(4, 4, 21, 21, [[0, rgba(theme.rimHi, 0.95)], [0.5, rgba(theme.accent, 0.72)], [1, rgba(theme.rimLo, 0.55)]]);
    ctx.stroke(glyph);

    ctx.restore();
  }

  function render(now) {
    frame = 0;
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    resize();
    fade = visible ? Math.min(1, fade + dt / FADE_IN_S) : Math.max(0, fade - dt / FADE_OUT_S);
    if (paused || reduceMotion.matches) sweep = 0.6;
    else sweep = (sweep + dt / SWEEP_S) % 1;
    ripples = ripples.filter((start) => now - start < RIPPLE_S * 1000);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const alpha = paused ? fade * 0.78 : fade;
    if (alpha > 0.001) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = alpha;
      drawRipples(now);
      drawPointer();
      ctx.globalAlpha = 1;
    }
    if (visible || fade > 0 || ripples.length > 0) schedule();
    else last = 0;
  }

  function schedule() {
    if (!frame) frame = requestAnimationFrame(render);
  }

  window.cursor = {
    theme(next) {
      theme = makeTheme(next && next.accent, !next || next.dark !== false);
      schedule();
    },
    show() {
      if (!visible && fade <= 0) sweep = 0;
      visible = true;
      schedule();
    },
    hide() {
      visible = false;
      schedule();
    },
    ripple() {
      if (!reduceMotion.matches) ripples.push(performance.now());
      schedule();
    },
    pause(value) {
      paused = value === true;
      schedule();
    },
  };
  resize();
})();
</script>
</body>
</html>
