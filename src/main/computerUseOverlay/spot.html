<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { --color: 0, 229, 255; transition: opacity .18s ease; }
body.dim { opacity: .45; }
.ring, .halo { position: absolute; box-sizing: border-box; pointer-events: none; }
.ring {
  inset: 26px;
  border: 2px solid rgba(var(--color), .8);
  border-radius: 10px;
  box-shadow: 0 0 12px rgba(var(--color), .4);
  animation: glow 1.3s ease-in-out infinite alternate;
}
.halo {
  inset: 19px;
  border: 6px solid rgba(var(--color), .14);
  border-radius: 17px;
  animation: pulse 1.3s ease-in-out infinite alternate;
}
@keyframes glow {
  from { box-shadow: 0 0 12px rgba(var(--color), .4); }
  to { box-shadow: 0 0 12px rgba(var(--color), .2); }
}
@keyframes pulse {
  from { inset: 19px; border-width: 6px; opacity: 1; }
  to { inset: 15px; border-width: 14px; opacity: .35; }
}
body.dim .ring, body.dim .halo { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .ring, .halo { animation: none; }
}
</style>
</head>
<body>
<div class="halo"></div>
<div class="ring"></div>
<script>
window.spot = {
  configure(style) {
    const hex = style && typeof style.color === "string" && /^#[0-9a-f]{6}$/i.test(style.color) ? style.color : "#00e5ff";
    const n = parseInt(hex.slice(1), 16);
    document.body.style.setProperty("--color", `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`);
    document.body.classList.toggle("dim", Boolean(style && style.dim));
  },
};
</script>
</body>
</html>
